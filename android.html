<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【AR体験】しん水スコープ Android版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="settings.js"></script>
<script src="ui.js"></script>
<script>
/* =====================================================================
   しん水スコープ / Flood Scope Android版（WebXR / ARCore）
   ---------------------------------------------------------------------
   ■ 文言と水の数値は settings.js（Unity 版の AppText / WaterSettings の写し）で変える
   ■ 画面の流れ（ロゴ → 説明 → 見かたをえらぶ → 床の設定 → 体験）とボタン類は ui.js。
     AR 中は ui.js の #fsHud を DOM オーバーレイとして重ねる
   ■ このファイルで編集してよいところ：SIMPLE（true=浸水と障害物だけ／false=車・浮遊物・側溝・マンホールも出す）、COR（通路の寸法）。
     それより下の three.js / WebXR の部分は触らない
   ■ リアルな見た目にしたいとき（SIMPLE=false）：models/ フォルダに .glb を置く（CC0 素材）。無ければ簡易形状で動く
   ■ 置き場所：https のサーバー必須（GitHub Pages など）
   ■ 動作条件：ARCore 対応 Android + Chrome。奥行き（本物が正しく沈む）は機種依存
   ===================================================================== */
(() => {
  // ================= 設定（ここを編集） =================
  const SIMPLE = true;   // 浸水（高さ・にごり）と障害物だけ。車・浮遊物・側溝・マンホールは出さない
  const WS = window.WATER_SETTINGS;
  // 空の照り返しの色は Unity のシェーダーと同じ
  const WATER = { clear: WS.clearColor, mud: WS.mudColor, sky: [0.82, 0.84, 0.87] };
  const COR = { w: 1.5, len: 3.0, gutterX: 0.98, gutterW: 0.22, laneX: -2.0, manhole: { x: 0.25, z: 0.95, r: 0.3 } };
  // 3Dモデル（glTF/.glb）。同じフォルダの models/ に置くと簡易形状の代わりに使われる。無ければ簡易形状のまま。
  // size: 実物の大きさ（m）に合わせて自動で拡大縮小する基準（車=全長、その他=いちばん長い辺）。rotY: 向きの補正（度）
  const MODELS = {
    car:    { file: 'models/car.glb',    size: 4.2,  rotY: 0 },   // 正面（前）が -z を向くモデルなら rotY: 0
    bottle: { file: 'models/bottle.glb', size: 0.25, rotY: 0, lay: true },
    bag:    { file: 'models/bag.glb',    size: 0.4,  rotY: 0 },
    can:    { file: 'models/can.glb',    size: 0.12, rotY: 0, lay: true },
    branch: { file: 'models/branch.glb', size: 0.6,  rotY: 0 },
    bucket: { file: 'models/bucket.glb', size: 0.3,  rotY: 0 },
    foam:   { file: 'models/foam.glb',   size: 0.38, rotY: 0 },
    manhole:{ file: 'models/manhole.glb', size: 0.6, rotY: 0 },
  };
  const S = { floorY: 0, level: 0, placed: false, t: 0, overflowT: 0, murk: 0, reveal: false, occ: true, lock: false, car: null, debris: [], debrisT: 0, mhT: 0, refract: true, reflect: true, sound: false, murkMode: 'level', debrisOn: true, opaque: false, height: 150 };
  const $ = id => document.getElementById(id);
  const T = window.APP_TEXT, Wt = FloodUI.Water;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[c]);
  // 画面の流れとボタン類（ui.js）。AR 中は #fsHud を DOM オーバーレイにする
  FloodUI.start({
    onEnter: enter,
    onFinish: leave,
    onReplace: () => { S.placed = false; cor.visible = false; },
  });

  // ---------- three.js ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.domElement.style.position = 'fixed'; renderer.domElement.style.inset = '0';
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.02, 40);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.5); sun.position.set(1, 3, 1); scene.add(sun);

  // 通路の原点（入口の立ち位置）
  const cor = new THREE.Group(); cor.visible = false; cor.scale.x = -1; scene.add(cor); // +z が通路の奥、+x が右手

  // レティクル
  const reticle = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.16, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  // ---------- 水（シェーダー：濁り・流れ・奥行きによる隠れ） ----------
  const depthTex = new THREE.DataTexture(new Float32Array(4), 2, 2, THREE.RedFormat, THREE.FloatType);
  depthTex.minFilter = THREE.NearestFilter; depthTex.magFilter = THREE.NearestFilter;
  const MAXOBJ = 16;
  const waterUniforms = {
    uTime: { value: 0 }, uMurk: { value: 0 }, uLevel: { value: 0 }, uSpread: { value: 0 }, uPuddle: { value: 0 },
    uGutterX: { value: COR.gutterX }, uDepth: { value: depthTex }, uUseDepth: { value: 0 }, uDepthTexel: { value: new THREE.Vector2(1 / 160, 1 / 90) },
    uDepthMat: { value: new THREE.Matrix4() }, uVp: { value: new THREE.Vector4(0, 0, 1, 1) },
    uCamPos: { value: new THREE.Vector3() }, uSun: { value: new THREE.Vector3(0.3, 0.8, -0.5).normalize() },
    uObj: { value: Array.from({ length: MAXOBJ }, () => new THREE.Vector4()) }, uObjN: { value: 0 },
    uCar: { value: new THREE.Vector4(0, 0, 0, 0) }, // x, z, 速さ(0..1), 有効
    uCam: { value: null }, uUseCam: { value: 0 }, uCamFlip: { value: 0 }, uOpaque: { value: 0 }, uHorizon: { value: 0.5 }, uReflect: { value: 1 },
    uOpacity: { value: WS.clearOpacity }, uMudOpacity: { value: WS.mudOpacity }, uRefract: { value: WS.refract }, uFoam: { value: WS.foamMud }, uFlowSpeed: { value: WS.flowSpeed }, uWaveK: { value: 1 },
    uClear: { value: new THREE.Vector3(...WATER.clear) }, uMud: { value: new THREE.Vector3(...WATER.mud) }, uSky: { value: new THREE.Vector3(...WATER.sky) },
  };
  const waterMat = new THREE.ShaderMaterial({
    uniforms: waterUniforms, transparent: true, depthWrite: false,
    vertexShader: `
      varying vec3 vLocal; varying float vViewZ; varying vec3 vWorld;
      void main(){ vLocal = position; vec4 w = modelMatrix * vec4(position,1.0); vWorld = w.xyz; vec4 mv = viewMatrix * w; vViewZ = -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `
      precision highp float;
      #define MAXOBJ ${MAXOBJ}
      uniform float uTime, uMurk, uLevel, uSpread, uPuddle, uGutterX, uUseDepth; uniform sampler2D uDepth; uniform mat4 uDepthMat; uniform vec4 uVp; uniform vec2 uDepthTexel;
      uniform vec3 uCamPos, uSun, uClear, uMud, uSky; uniform vec4 uObj[MAXOBJ]; uniform int uObjN; uniform vec4 uCar;
      uniform sampler2D uCam; uniform float uUseCam, uCamFlip, uOpaque, uHorizon, uReflect;
      uniform float uOpacity, uMudOpacity, uRefract, uFoam, uFlowSpeed, uWaveK;
      varying vec3 vLocal; varying float vViewZ; varying vec3 vWorld;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
      // 高さ場：右→左に流れる多重ノイズ ＋ 雨の波紋 ＋ 物体のまわりの輪
      float height(vec2 p){
        vec2 flow = vec2(uTime*0.35, uTime*0.04);
        float h = 0.0;
        h += noise(p*2.2 + flow) * 0.40;
        h += noise(p*5.1 + flow*1.7 + 3.1) * 0.20;
        h += noise(p*11.0 + flow*2.6 + 7.7) * 0.10;
        h += noise(p*23.0 - flow*1.3 + 1.3) * 0.05;
        h += noise(vec2(p.x*40.0, p.y*6.0) + flow*3.0) * 0.06;   // 風の細かい横縞
        // 雨の波紋（格子ごとにランダムな時刻で広がる輪）
        vec2 g = floor(p*7.0); vec2 c = (g + 0.5 + (vec2(hash(g), hash(g+9.0)) - 0.5)*0.8) / 7.0;
        float t0 = hash(g+3.0)*2.0; float ph = fract((uTime + t0)*0.9);
        float r = ph*0.25; float d = length(p - c);
        h += (1.0-ph) * 0.12 * sin((d - r)*110.0) * smoothstep(0.025, 0.0, abs(d - r));
        // 浮遊物のまわりの輪
        for (int i = 0; i < MAXOBJ; i++) { if (i >= uObjN) break;
          vec2 op = uObj[i].xy; float dd = length(p - op);
          h += 0.08 * sin(dd*40.0 - uTime*6.0 + uObj[i].z) * exp(-dd*6.0);
        }
        // 車の引き波（V字）
        if (uCar.w > 0.5) { vec2 cp = p - uCar.xy; float back = cp.y; float side = abs(cp.x) - 0.85;
          float v = smoothstep(0.15, 0.0, abs(side - back*0.35)) * step(0.0, back) * exp(-back*0.6) * uCar.z;
          h += v * 0.35 * sin(back*14.0 - uTime*8.0); }
        return h;
      }
      void main(){
        // 本物の物体による隠れ：奥行きマップは粗いので、周囲9点の「隠れている割合」を使って境界をなめらかにする
        float occ = 0.0;
        if (uUseDepth > 0.5) {
          vec2 nv = vec2((gl_FragCoord.x - uVp.x) / uVp.z, 1.0 - (gl_FragCoord.y - uVp.y) / uVp.w);
          vec2 duv = (uDepthMat * vec4(nv, 0.0, 1.0)).xy;
          if (duv.x >= 0.0 && duv.x <= 1.0 && duv.y >= 0.0 && duv.y <= 1.0) {
            vec2 tx = uDepthTexel * 0.7;
            for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
              float d = texture2D(uDepth, clamp(duv + vec2(float(i), float(j)) * tx, 0.0, 1.0)).r;
              // 奥行きの差が小さいところはゆるやかに（水面すれすれの物のちらつきを抑える）
              occ += (d > 0.0) ? (1.0 - smoothstep(-0.10, -0.02, d - vViewZ)) : 0.0;
            }
            occ /= 9.0;
          }
        }
        if (occ > 0.985) discard;
        float x = vLocal.x, z = 1.5 - vLocal.y;
        vec2 p = vec2(x, z);
        float edgeA = 1.0;
        if (uPuddle > 0.5) {
          float edge = uGutterX - uSpread + 0.12*sin(z*5.0+uTime*1.2) + 0.08*sin(z*11.0-uTime*0.7);
          if (x > uGutterX + 0.3 || z < -0.6 || z > 3.6) discard;
          edgeA = smoothstep(edge - 0.06, edge + 0.06, x); if (edgeA <= 0.01) discard;
        }
        // 法線（有限差分）
        float e = 0.012;
        float h0 = height(p), hx = height(p + vec2(e,0.0)), hz = height(p + vec2(0.0,e));
        vec3 n = normalize(vec3(-(hx-h0)/e*0.05*uWaveK, 1.0, -(hz-h0)/e*0.05*uWaveK));   // 波の強さ（waveStrength）
        vec3 V = normalize(uCamPos - vWorld);
        vec3 L = normalize(uSun);
        float diff = max(0.0, dot(n, L));
        vec3 H = normalize(L + V);
        float spec = pow(max(0.0, dot(n, H)), 140.0);
        float fres = pow(1.0 - max(0.0, dot(n, V)), 3.0);
        // ---------- 色：Unity の FloodWater.shader と同じ決め方 ----------
        // カメラ映像：屈折（足もとがゆがんで透ける）と映り込み（水平線で上下に折り返す）
        bool haveCam = uUseCam > 0.5;
        vec3 refr = uSky, refl = uSky;
        if (haveCam) {
          vec2 uv = vec2((gl_FragCoord.x - uVp.x) / uVp.z, (gl_FragCoord.y - uVp.y) / uVp.w);
          if (uCamFlip > 0.5) uv.y = 1.0 - uv.y;
          vec2 dist = n.xz * 8.0;
          refr = texture2D(uCam, clamp(uv + dist * uRefract, 0.0, 1.0)).rgb;
          vec2 uvr = vec2(uv.x, 2.0 * uHorizon - uv.y) + dist * (uRefract * 2.0 + 0.01);
          bool reflOk = uvr.y > 0.0 && uvr.y < 1.0;
          if (reflOk) refl = texture2D(uCam, clamp(uvr, 0.0, 1.0)).rgb;
          // 映り込みは水平線から離れるほど薄く（遠くの物ほどはっきり映る）
          refl = mix(uSky, refl, clamp((uHorizon - uv.y) * 2.5 + 0.35, 0.0, 1.0));
        }
        // 真水：足もとの映像に色を乗せ、映り込みを重ねる
        vec3 clearCol = mix(refr, refr * uClear * 1.15, uOpacity * 0.8);
        clearCol = mix(clearCol, refl, clamp(fres * 0.6 + 0.15, 0.0, 1.0) * uReflect);
        // 泥水：流れ（右→左）に沿って伸びる細かい泡
        float adv = uTime * uFlowSpeed;
        vec2 fc = vec2((-x - adv) * 8.0, z * 32.0);
        float foamN = noise(fc) * 0.65 + noise(fc * 2.3 + vec2(adv * 0.5, 0.0)) * 0.35;
        float foam = smoothstep(0.62, 0.70, foamN) * uFoam * 0.6;
        foam *= clamp(1.0 - (length(uCamPos - vWorld) - 1.5) / 6.0, 0.0, 1.0);   // 遠くはちらつくので薄く
        float grain = noise(p * 48.0 + vec2(adv * 0.5, 0.0)) * 2.0 - 1.0;
        vec3 mudBase = uMud * (0.85 + h0 * 0.35) * (1.0 + grain * 0.05);
        vec3 foamCol = mix(vec3(0.93, 0.88, 0.80), uMud, 0.35);                    // 泥色を 35% 混ぜたベージュ
        vec3 mudCol = mix(mudBase, foamCol, clamp(foam, 0.0, 1.0));
        mudCol = mix(mudCol, refl, clamp(fres * 0.5, 0.0, 1.0) * uReflect * 0.12);
        // 足もとの映像をどれだけ透かすか。浅いほど透け、uMudOpacity を下げると濃い泥水でも透ける
        float show = clamp((1.0 - uMurk) * 0.5 + (1.0 - uMudOpacity), 0.0, 1.0);
        if (haveCam) mudCol = mix(mudCol, refr * 0.6 + mudCol * 0.4, show);
        vec3 col = mix(clearCol, mudCol, uMurk);
        col += vec3(0.9, 0.9, 0.85) * spec * 0.35;                                  // ハイライト
        // 足もとを完全に隠す
        col = mix(col, mix(uMud, foamCol, clamp(foam, 0.0, 1.0) * 0.7), uOpaque);
        // 透明度：カメラ映像があれば Unity と同じ。無いときは本物の映像に重ねるので、透け具合を透明度で出す
        float a = mix(0.9, 1.0, max(uMurk, uOpaque));
        if (!haveCam) {
          float aClear = clamp(uOpacity * 0.6 + fres * 0.6 * uReflect, 0.0, 0.95);
          float aMud = 1.0 - 0.6 * show;
          a = mix(mix(aClear, aMud, uMurk), 1.0, uOpaque);
        }
        if (uPuddle > 0.5) a *= 0.8 * edgeA;
        // 物との境界：少し明るい水際の線を入れて、段差をなじませる
        float edge = smoothstep(0.05, 0.45, occ) * (1.0 - smoothstep(0.45, 0.95, occ));
        col = mix(col, vec3(0.92, 0.92, 0.88), edge * 0.45);
        a *= (1.0 - occ);
        gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
      }`,
  });
  const water = new THREE.Mesh(new THREE.PlaneGeometry(24, 24, 1, 1), waterMat);
  water.rotation.x = -Math.PI / 2; water.position.set(0, 0.001, 1.5); water.renderOrder = 5; water.visible = false;
  cor.add(water);

  // 側溝（グレーチング）とマンホール（仮想。SIMPLE=false のみ表示）
  const gutter = new THREE.Mesh(new THREE.BoxGeometry(COR.gutterW, 0.01, 3.8), new THREE.MeshStandardMaterial({ color: 0x2b2f33 }));
  gutter.position.set(COR.gutterX + COR.gutterW / 2, 0.005, 1.5); cor.add(gutter);
  for (let z = -0.3; z < 3.4; z += 0.12) { const b = new THREE.Mesh(new THREE.BoxGeometry(COR.gutterW, 0.012, 0.015), new THREE.MeshStandardMaterial({ color: 0x8e939a })); b.position.set(COR.gutterX + COR.gutterW / 2, 0.008, z); b.userData.grate = true; cor.add(b); }
  const mh = COR.manhole;
  const mhHole = new THREE.Mesh(new THREE.CircleGeometry(mh.r, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x6e6a62 }));
  mhHole.position.set(mh.x, 0.004, mh.z); cor.add(mhHole);
  const mhLid = new THREE.Mesh(new THREE.CylinderGeometry(mh.r, mh.r, 0.02, 32), new THREE.MeshStandardMaterial({ color: 0x7f7a70 }));
  mhLid.position.set(mh.x, 0.01, mh.z); cor.add(mhLid);
  const spout = new THREE.Group(); cor.add(spout);
  for (let i = 0; i < 14; i++) { const st = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.02, 0.6, 5), new THREE.MeshBasicMaterial({ color: 0xf0f5eb, transparent: true, opacity: 0.85 })); st.userData.a = i / 14 * Math.PI * 2; spout.add(st); }
  spout.visible = false;
  const revealRing = new THREE.Mesh(new THREE.RingGeometry(mh.r * 1.1, mh.r * 1.25, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xff5a3c, depthTest: false }));
  revealRing.position.set(mh.x, 0.02, mh.z); revealRing.renderOrder = 9; revealRing.visible = false; cor.add(revealRing);

  // ---------- 3Dモデルの読み込み（無ければ何もしない） ----------
  const loaded = {};
  const gltfLoader = (!SIMPLE && typeof THREE.GLTFLoader === 'function') ? new THREE.GLTFLoader() : null;
  function fitModel(obj, size, lay) {
    const box = new THREE.Box3().setFromObject(obj); const sz = new THREE.Vector3(); box.getSize(sz);
    const longest = Math.max(sz.x, sz.y, sz.z) || 1; obj.scale.setScalar(size / longest);
    const b2 = new THREE.Box3().setFromObject(obj); obj.position.y -= b2.min.y; // 底を 0 に
    const c = new THREE.Vector3(); b2.getCenter(c); obj.position.x -= c.x; obj.position.z -= c.z;
    if (lay) { obj.rotation.z = Math.PI / 2; const b3 = new THREE.Box3().setFromObject(obj); obj.position.y -= b3.min.y; }
    return obj;
  }
  Object.entries(MODELS).forEach(([k, m]) => {
    if (!gltfLoader) return;
    gltfLoader.load(m.file, g => {
      const root = new THREE.Group(); const obj = g.scene; obj.rotation.y = (m.rotY || 0) * Math.PI / 180; root.add(fitModel(obj, m.size, m.lay));
      loaded[k] = root;
      if (k === 'car') swapCar(root);
      if (k === 'manhole') { mhLid.visible = false; const lid = root.clone(); lid.position.set(mh.x, 0.005, mh.z); cor.add(lid); mhLidModel = lid; }
    }, undefined, () => {});
  });
  let mhLidModel = null;

  // ---------- 浮遊物（SIMPLE=false のみ） ----------
  const debrisGroup = new THREE.Group(); cor.add(debrisGroup);
  function makeDebris(k) {
    if (loaded[k]) return loaded[k].clone();
    const g = new THREE.Group();
    const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c }, o || {}));
    if (k === 'bottle') { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.24, 12).rotateZ(Math.PI / 2), M(0xb4dcf0, { transparent: true, opacity: 0.85 })); g.add(b); const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.03, 8).rotateZ(Math.PI / 2), M(0x2a6fb0)); cap.position.x = -0.135; g.add(cap); }
    else if (k === 'bag') { const b = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), M(0x2f3438)); b.scale.set(1.3, 0.6, 1); g.add(b); }
    else if (k === 'can') { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.033, 0.033, 0.12, 12).rotateZ(Math.PI / 2), M(0xd9d9d9, { metalness: 0.6, roughness: 0.4 })); g.add(b); }
    else if (k === 'branch') { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.025, 0.6, 6).rotateZ(Math.PI / 2), M(0x6b4a2b)); g.add(b); const t = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.22, 5), M(0x6b4a2b)); t.position.set(0.1, 0.08, 0); t.rotation.z = -0.6; g.add(t); }

    mhHole.material.color.set(popped ? 0x0d0f11 : 0x6e6a62);
    mhLid.position.set(popped ? mh.x + mh.r * 1.5 : mh.x, 0.01, popped ? mh.z + 0.1 : mh.z);
    if (mhLidModel) mhLidModel.position.set(popped ? mh.x + mh.r * 1.5 : mh.x, 0.005, popped ? mh.z + 0.1 : mh.z);
    const age = S.t - S.mhT; spout.visible = popped && age < 4;
    if (spout.visible && !SIMPLE) spout.children.forEach((st, i) => { const hgt = (0.3 + 0.5 * Math.sin(age * 3 + i)) * (1 - age / 4); st.scale.y = Math.max(0.05, hgt / 0.6); st.position.set(mh.x + Math.cos(st.userData.a) * mh.r * 0.6, hgt / 2, mh.z + Math.sin(st.userData.a) * mh.r * 0.6); st.rotation.z = Math.cos(st.userData.a) * 0.4; st.rotation.x = -Math.sin(st.userData.a) * 0.4; });
    revealRing.visible = !SIMPLE && S.reveal && S.placed;
    updateDebris(dt, lvl); updateCar(dt, lvl); if (S.sound) snd.update(dt);
    renderer.render(scene, camera);
  }
})();
</script>
