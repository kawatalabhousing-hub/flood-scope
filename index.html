<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【AR体験】しん水スコープ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  /* 体験画面：カメラ映像＋水を描くキャンバス（ボタン類は ui.js の #fsHud が上に重なる） */
  #exp{position:fixed;inset:0;background:#000;display:none;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
  #exp.on{display:block}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;opacity:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* 元の版の「センサーON」：体験中は右上にいつも出て、センサーの状態を表示する。押すと許可を取り直す */
  #sensorBtn{position:absolute;z-index:25;top:calc(10px + env(safe-area-inset-top,0px));right:10px;border:0;border-radius:999px;padding:10px 18px;background:rgba(0,0,0,.55);color:#fff;font:900 15px "Zen Maru Gothic",sans-serif;cursor:pointer}
  #sensorBtn[hidden]{display:none}
  /* 係員用：通路と障害物の位置合わせ（リモコンの K で開閉） */
  #calPanel{position:fixed;z-index:30;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;max-width:560px;margin:0 auto;background:rgba(0,0,0,.72);border-radius:14px;padding:12px 14px;display:grid;gap:8px;color:#fff;font:500 14px "Zen Maru Gothic",sans-serif}
  #calPanel[hidden]{display:none}
  #calPanel label{display:grid;grid-template-columns:5.5em 1fr 4em;gap:8px;align-items:center}
  #calPanel input[type=range]{width:100%}
  #calPanel select{font:inherit;padding:4px;border-radius:8px}
  #calPanel .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #calPanel .row2 button{flex:1 1 100%;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font:900 14px "Zen Maru Gothic",sans-serif}
  #calPanel .row2 span{color:#fff;font-size:13px}
</style>
</head>
<body>

<div id="exp">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <button id="sensorBtn" hidden></button>
</div>
    <div id="calPanel" hidden>
      <label>向き <input type="range" id="calYaw" min="-40" max="40" step="0.5" value="0"><span id="calYawV">0°</span></label>
      <label>目の高さ <input type="range" id="calEye" min="0.8" max="1.8" step="0.01" value="1.1"><span id="calEyeV">1.10m</span></label>
      <label>画角の広さ <input type="range" id="calFov" min="40" max="100" step="1" value="66"><span id="calFovV">66°</span></label>
      <label>前後 <input type="range" id="calZ" min="-1" max="1" step="0.02" value="0"><span id="calZV">0.00m</span></label>
      <label>通路の幅 <select id="calW"><option value="1.2">1.2m</option><option value="1.5" selected>1.5m</option></select><span></span></label>
      <div class="row2"><button id="calStraight">いま向いている方向を「まっすぐ」にする</button><button id="calClose">閉じる</button><span style="color:#fff;font-size:12px">障害物1（1.0m左）</span><select id="calH1"><option value="cone:0.3">ミニコーン30cm</option><option value="cone:0.45">ミニコーン45cm</option><option value="brick:flat">スチロールブロック 平置き（高さ10cm）</option><option value="brick:side" selected>スチロールブロック 横立て（高さ19cm）</option><option value="brick:up">スチロールブロック 縦立て（高さ39cm）</option><option value="block:0.3">発泡ブロック30cm角</option><option value="block:0.5">発泡ブロック50cm角</option><option value="off">置かない</option></select><span style="color:#fff;font-size:12px">障害物2（1.5m右）</span><select id="calH2"><option value="cone:0.3" selected>ミニコーン30cm</option><option value="cone:0.45">ミニコーン45cm</option><option value="brick:flat">スチロールブロック 平置き（高さ10cm）</option><option value="brick:side">スチロールブロック 横立て（高さ19cm）</option><option value="brick:up">スチロールブロック 縦立て（高さ39cm）</option><option value="block:0.3">発泡ブロック30cm角</option><option value="block:0.5">発泡ブロック50cm角</option><option value="off">置かない</option></select><span style="color:#fff;font-size:12px">障害物3（2.2m左）</span><select id="calH3"><option value="cone:0.3">ミニコーン30cm</option><option value="cone:0.45" selected>ミニコーン45cm</option><option value="brick:flat">スチロールブロック 平置き（高さ10cm）</option><option value="brick:side">スチロールブロック 横立て（高さ19cm）</option><option value="brick:up">スチロールブロック 縦立て（高さ39cm）</option><option value="block:0.3">発泡ブロック30cm角</option><option value="block:0.5">発泡ブロック50cm角</option><option value="off">置かない</option></select></div>
    </div>

<script src="settings.js"></script>
<script src="ui.js"></script>
<script>
/* =====================================================================
   しん水スコープ / Flood Scope（共通版）  内水氾濫体験
   ---------------------------------------------------------------------
   ■ 文言と水の数値は settings.js（Unity 版の AppText / WaterSettings の写し）で変える
   ■ 画面の流れ（ロゴ → 説明 → 見かたをえらぶ → 床の設定 → 体験）とボタン類は ui.js
   ■ このファイルは、カメラ映像とジャイロで見回す仮想の通路に、水を 2D キャンバスで描く部分
     - COR : 通路の寸法、コーンの高さ、障害物の位置と高さ
   ■ 置き場所：https のサーバー（GitHub Pages など）
   ===================================================================== */
(() => {
  // ================= 設定（ここを編集） =================
  const SIMPLE = true;   // 浸水（高さ・にごり）と障害物だけ。車・浮遊物・側溝・マンホールは出さない
  const WS = window.WATER_SETTINGS;
  // 水の色（0〜255）。真水・泥水は settings.js、空の照り返しは元の共通版と同じ色
  const WATER = {
    clear: WS.clearColor.map(v => Math.round(v * 255)),
    mud: WS.mudColor.map(v => Math.round(v * 255)),
    sky: [212, 205, 192],   // 元の版と同じ（少し暖色）
  };
  // 画像素材（PNG・背景透明）。同じフォルダの img/ に置くと簡易図形の代わりに描かれる（SIMPLE=false のときだけ使う）
  const IMAGES = {
    car: { file: 'img/car.png', w: 1.75 }, carStalled: { file: 'img/car_hazard.png', w: 1.75 },
    bottle: { file: 'img/bottle.png', w: 0.25 }, bag: { file: 'img/bag.png', w: 0.4 }, can: { file: 'img/can.png', w: 0.12 },
    branch: { file: 'img/branch.png', w: 0.6 }, bucket: { file: 'img/bucket.png', w: 0.3 }, foam: { file: 'img/foam.png', w: 0.38 },
  };
  const IMG = {};
  if (!SIMPLE) Object.entries(IMAGES).forEach(([k, v]) => { const im = new Image(); im.onload = () => { IMG[k] = im; }; im.onerror = () => {}; im.src = v.file; });
  function drawImg(k, X, Y, ppm) {
    const im = IMG[k]; if (!im) return false;
    const w = IMAGES[k].w * ppm, h = w * im.height / im.width;
    ctx.drawImage(im, X - w / 2, Y - h, w, h); return true;
  }
  const WC = 'rgba(100,110,75,0.62)';
  const S = {
    level: 0, lvl: 0, cam: false,
    eyeH: Math.round(150 * 0.93) / 100, gyro: false, orientT: 0, q: null, dragYaw: 0, dragPitch: 0, t: 0,
    corridor: true, station: 0, calib: false, reflect: true, cal: { yaw: 0, fov: 66, z: 0, x: 0 }, sound: false,
    car: null, debris: [], debrisT: 0, overflowT: 0, mhT: 0, murk: 0, debrisOn: false, opaque: false, reveal: false,
  };
  try { const c = JSON.parse(localStorage.getItem('cal') || 'null'); if (c && typeof c.fov === 'number') S.cal = c; } catch (e) {}
  if (!S.cal.w) S.cal.w = 1.5;
  try { const e = +localStorage.getItem('eyeH'); if (e >= 0.8 && e <= 1.8) S.eyeH = e; } catch (e) {}

  const $ = id => document.getElementById(id);
  const exp = $('exp'), cv = $('cv'), ctx = cv.getContext('2d'), cam = $('cam');
  let raf = 0, stream = null;

  // ---------- カメラ ----------
  const T = window.APP_TEXT;
  // 取れなかったときは、画面に出す理由（{ text }）を投げる
  async function startCam() {
    if (window.isSecureContext === false) throw { text: T.errCamInsecure };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { text: T.errCamNone };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) {
      S.cam = false;
      const why = { NotAllowedError: T.errCamDenied, SecurityError: T.errCamDenied, NotFoundError: T.errCamNone, OverconstrainedError: T.errCamNone, NotReadableError: T.errCamBusy, AbortError: T.errCamBusy }[e && e.name];
      throw { text: why || T.errCamOther + '（' + (e && (e.name || e.message)) + '）' };
    }
    cam.srcObject = stream; cam.style.display = 'block';
    try { await cam.play(); } catch (e) {}
    S.cam = true;
  }
  function stopCam() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    cam.srcObject = null; cam.style.display = 'none'; S.cam = false;
  }

  // ---------- センサー（ジャイロ） ----------
  // iPhone は許可（DeviceOrientationEvent.requestPermission）が要る。ボタンを押した直後、ほかの await より先に呼ぶ
  // strict=true のときは、許可されなければ理由を投げる（見かたをえらぶ画面に出る）
  let sensorListening = false, sensorTimer = 0;
  const sensorBtn = $('sensorBtn');
  const tiltOK = () => S.gyro;   // 傾きが一度でも取れたか（取れるまでは水面を描かない）
  async function enableSensor(strict) {
    if (typeof DeviceOrientationEvent === 'undefined') { sensorBtn.textContent = T.sensorNone; return; }
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      let r = 'denied';
      try { r = await DeviceOrientationEvent.requestPermission(); } catch (e) {}
      if (r !== 'granted') { sensorBtn.textContent = T.sensorDenied; if (strict) throw { text: T.errSensorDenied }; return; }
    }
    if (!sensorListening) { window.addEventListener('deviceorientation', onOrient, true); sensorListening = true; }
    sensorBtn.textContent = T.sensorChecking;
    clearTimeout(sensorTimer);
    sensorTimer = setTimeout(() => { sensorBtn.textContent = tiltOK() ? T.sensorActive : T.sensorNone; }, 1500);
  }
  sensorBtn.textContent = T.sensorOn;
  sensorBtn.addEventListener('click', () => enableSensor(false));
  // クォータニオン小道具
  const qMul = (a, b) => [
    a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
    a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
    a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
    a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
  function qFromEulerYXZ(x, y, z) {
    const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2);
    const s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
    return [s1*c2*c3 + c1*s2*s3, c1*s2*c3 - s1*c2*s3, c1*c2*s3 - s1*s2*c3, c1*c2*c3 + s1*s2*s3];
  }
  function qRotate(q, v) {
    const [x, y, z, w] = q;
    const ix =  w*v[0] + y*v[2] - z*v[1], iy = w*v[1] + z*v[0] - x*v[2];
    const iz =  w*v[2] + x*v[1] - y*v[0], iw = -x*v[0] - y*v[1] - z*v[2];
    return [ix*w + iw*-x + iy*-z - iz*-y, iy*w + iw*-y + iz*-x - ix*-z, iz*w + iw*-z + ix*-y - iy*-x];
  }
  function onOrient(e) {
    if (e.alpha == null) return;
    const D = Math.PI / 180;
    const orient = (screen.orientation && screen.orientation.angle != null ? screen.orientation.angle : (window.orientation || 0)) * D;
    let q = qFromEulerYXZ(e.beta * D, e.alpha * D, -e.gamma * D);
    q = qMul(q, [-Math.SQRT1_2, 0, 0, Math.SQRT1_2]);            // 端末座標→カメラ座標
    q = qMul(q, [0, 0, -Math.sin(orient/2), Math.cos(orient/2)]); // 画面の向き補正
    S.q = q; S.gyro = true;
  }
  // ドラッグで見回す（センサーなし用）
  let dragging = false, dragged = false, lx = 0, ly = 0;
  function dragStart(e) { dragging = true; dragged = false; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); }
  function dragEnd(e) { dragging = false; }
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragged = true;
    S.dragYaw += dx * 0.004; S.dragPitch = Math.max(-1.2, Math.min(1.2, S.dragPitch + dy * 0.004));
  });
  // 端末の向き（水平面での方位）。前方向だけで計算すると、床に向けたとき（真下に近いとき）に少しの横傾きで
  // 数十度ずれるので、画面の上方向を足して求める（前を向いていても床を向いていても同じ方位になる）
  function heading(q) { const f = qRotate(q, [0, 0, -1]), u = qRotate(q, [0, 1, 0]); return Math.atan2(f[0] + u[0], -(f[2] + u[2])); }
  function rawYaw() { return S.gyro && S.q ? heading(S.q) : 0; }   // 床タップ・「まっすぐ」ボタン用
  function viewAngles() {
    let yaw = 0, pitch = 0;
    if (S.gyro && S.q) {
      const f = qRotate(S.q, [0, 0, -1]);
      yaw = Math.atan2(f[0], -f[2]);
      pitch = Math.asin(Math.max(-1, Math.min(1, f[1])));
    }
    yaw += S.dragYaw;
    if (S.corridor) { yaw += S.cal.yaw; if (S.station === 1 && S.gyro) yaw -= Math.PI; }
    return { yaw, pitch: pitch - S.dragPitch * (S.gyro ? 0 : 1) };
  }

  // ---------- 描画 ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = exp.clientWidth; H = exp.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => setTimeout(resize, 300));

  // まちの構成（単位 m、zが奥）
  const buildings = [];
  for (let i = 0; i < 7; i++) {
    const z0 = 3 + i * 6.5, d = 5.5, hgt = 6 + ((i * 7) % 5);
    buildings.push({ x0: -14, x1: -4.5, z0, z1: z0 + d, h: hgt, c: i % 2 ? '#8a8f95' : '#a19a8f' });
    buildings.push({ x0: 4.5, x1: 14, z0: z0 + 2, z1: z0 + 2 + d, h: hgt + 2, c: i % 2 ? '#9a948b' : '#858b91' });
  }
  const figures = [
    { k: 'child', x: -1.5, z: 3.6, h: 1.2, name: 'こども 120cm' },
    { k: 'woman', x: 0.7,  z: 4.6, h: 1.58, name: 'おとな 158cm' },
    { k: 'man',   x: 2.4,  z: 6.0, h: 1.71, name: 'おとな 171cm' },
    { k: 'car',   x: 0.2,  z: 30, h: 1.5, base: -1.0, name: '' },
  ];
  const manhole = { x: 0.9, z: 3.0, r: 0.32 };
  const subway = { x: -3.6, z: 8.5 };

  // ---------- 通路（会議室のブース）の寸法：単位m、入口の立ち位置が原点、奥が+z ----------
  const COR = {
    w: 1.5, len: 3.0, coneH: 0.70, coneR: 0.19, barH: 0.66,
    cones: [], bars: [],
    gutter: { x0: 0.98, x1: 1.2 },         // 右側の側溝（仮想）
    lane: -2.0,                             // 左側の車道の中心
    manhole: { x: 0.25, z: 0.95, r: 0.3 },
    // 障害物（実物）。1=1.0m左寄り スチロールブロック横立て(19cm)、2=1.5m右寄り ミニコーン30cm、3=2.2m左寄り ミニコーン45cm
    cushions: [
      { x: -0.35, z: 1.0, kind: 'block', w: 0.39, d: 0.10, h: 0.19, r: 0.195, on: true },
      { x: 0.35, z: 1.5, kind: 'cone', h: 0.30, r: 0.10, on: true },
      { x: -0.35, z: 2.2, kind: 'cone', h: 0.45, r: 0.12, on: true },
    ],
  };
  function setCorridorWidth(w) {
    COR.w = w; COR.cones.length = 0;
    [0, 1.5, 3.0].forEach(z => { COR.cones.push({ x: -w / 2, z }); COR.cones.push({ x: w / 2, z }); });
    COR.gutter = { x0: w / 2 + 0.23, x1: w / 2 + 0.45 };
    COR.lane = -(w / 2 + 1.25);
    COR.cushions[0].x = -w * 0.23; COR.cushions[1].x = w * 0.23; if (COR.cushions[2]) COR.cushions[2].x = -w * 0.23;
  }
  COR.bars = [[0, 2], [2, 4], [1, 3], [3, 5], [4, 5]]; // コーン番号のペア
  setCorridorWidth(S.cal.w);

  function makeCamera(yaw, pitch, eyeX, vw, vh, ox, fov) {
    const f = (vw / 2) / Math.tan(fov / 2);
    const cy = vh / 2, cx = ox + vw / 2;
    const sy = Math.sin(yaw), cyw = Math.cos(yaw), sp = Math.sin(pitch), cp = Math.cos(pitch);
    const st = S.corridor && S.station === 1, cz = S.corridor ? S.cal.z : 0, cxo = S.corridor ? S.cal.x : 0;
    return {
      f, cx, cy, vw, vh, ox, pitch,
      // 世界座標→カメラ座標
      C(x, y, z) {
        if (st) { x = -x; z = COR.len - z; }
        const xr = x - eyeX - cxo, zr = z - cz;
        const xc = xr * cyw - zr * sy, zc = xr * sy + zr * cyw, yc = y - S.eyeH;
        return [xc, yc * cp - zc * sp, yc * sp + zc * cp];
      },
      P(x, y, z) {
        const v = this.C(x, y, z);
        return { x: cx + f * v[0] / v[2], y: cy - f * v[1] / v[2], z: v[2] };
      },
      // カメラ座標→画面
      S(v) { return { x: cx + f * v[0] / v[2], y: cy - f * v[1] / v[2], z: v[2] }; },
    };
  }

  // 近クリップつき多角形（手前が視点の後ろに回っても描ける）
  function poly3(c, pts, fill, stroke, lw) {
    const NEAR = 0.06;
    let cs = pts.map(p => c.C(p[0], p[1], p[2]));
    const out = [];
    for (let i = 0; i < cs.length; i++) {
      const a = cs[i], b = cs[(i + 1) % cs.length];
      const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
      if (ain) out.push(a);
      if (ain !== bin) {
        const t = (NEAR - a[2]) / (b[2] - a[2]);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]);
      }
    }
    if (out.length < 3) return false;
    ctx.beginPath();
    out.forEach((v, i) => { const p = c.S(v); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
    return true;
  }
  function quad(c, pts, color) { poly3(c, pts, color); }

  function drawCam(c) {
    if (!S.cam || !cam.videoWidth) return false;
    const { vw, vh, ox } = c;
    const sc = Math.max(vw / cam.videoWidth, vh / cam.videoHeight);
    const dw = cam.videoWidth * sc, dh = cam.videoHeight * sc;
    ctx.drawImage(cam, ox + (vw - dw) / 2, (vh - dh) / 2, dw, dh);
    return true;
  }

  function drawScene(c, eyeX) {
    const { vw, vh, ox } = c;
    const horizon = c.cy + c.f * Math.tan(c.pitch);
    const lvl = S.lvl;
    ctx.save();
    ctx.beginPath(); ctx.rect(ox, 0, vw, vh); ctx.clip();

    if (S.corridor) drawCorridor(c, lvl, horizon); else drawStreet(c, lvl, horizon);

    // 雨（水中の覆いと水位の見出しは ui.js の画面側が出す）
    FloodUI.drawRain(ctx, ox, vw, vh, S.t);

    if (S.calib && S.corridor) {
      const fs = Math.max(13, Math.min(28, vw / 17, vh / 14));
      ctx.font = `500 ${fs * 0.7}px "Zen Maru Gothic", sans-serif`;
      pill(c.cx, 56 + fs * 5.2, "緑の線を 本物のコーンに重ねる", fs * 0.7, "#fff", "rgba(31,111,139,.9)");
    }

  }


  // ===== 会議室の通路（AR／スコープ） =====
  function drawCorridor(c, lvl, horizon) {
    const { vw, vh, ox } = c;
    const real = drawCam(c);
    if (!real) {
      // カメラなし：会議室ふうの床とコーンを描く
      const g = ctx.createLinearGradient(0, 0, 0, Math.max(1, horizon));
      g.addColorStop(0, '#d9dde2'); g.addColorStop(1, '#eef0f2');
      ctx.fillStyle = g; ctx.fillRect(ox, 0, vw, vh);
      ctx.fillStyle = '#9a9ea3'; ctx.fillRect(ox, horizon, vw, vh);
      quad(c, [[-COR.w / 2 - 0.05, 0, -0.6], [COR.w / 2 + 0.05, 0, -0.6], [COR.w / 2 + 0.05, 0, 3.3], [-COR.w / 2 - 0.05, 0, 3.3]], '#6f7c8a'); // マット
      // 車道（右側）
      quad(c, [[COR.lane - 0.9, 0, -1], [COR.lane + 0.9, 0, -1], [COR.lane + 0.9, 0, 16], [COR.lane - 0.9, 0, 16]], '#4f5357');
    }
    // 側溝（仮想）
    const gt = COR.gutter;
    if (!SIMPLE) {
    quad(c, [[gt.x0, 0.002, -0.4], [gt.x1, 0.002, -0.4], [gt.x1, 0.002, 3.4], [gt.x0, 0.002, 3.4]], '#2b2f33');
    ctx.strokeStyle = '#8e939a'; ctx.lineWidth = 1.5;
    for (let z = -0.4; z < 3.4; z += 0.12) line3(c, [gt.x0, 0.004, z], [gt.x1, 0.004, z]);
    if (S.reveal || S.level === 0) label3(c, (gt.x0 + gt.x1) / 2, 0.25, 1.4, 'みぞ（側溝）', 0.09, '#fff', '#c8352e');

    drawManhole(c, COR.manhole, lvl);
    }

    // 沈むまえの障害物（カメラなしのときだけ描く。本物がある想定）
    if (!real) {
      COR.cushions.forEach(cu => { if (cu.on) obsDraw(c, cu, 0); });
      COR.cones.forEach(cn => cone(c, cn.x, cn.z, '#1f8a4c', '#146436'));
      COR.bars.forEach(([a, b]) => bar(c, COR.cones[a], COR.cones[b]));
    }

    // 水
    if (S.level === 5) drawPuddle(c, lvl); else if (lvl > 0 && lvl < S.eyeH) drawWaterPlane(c, lvl, horizon, 3.5);

    if (!SIMPLE) { drawDebris(c, lvl); drawCar(c, lvl, COR.lane, 3.2); }

    // 本物が水面から出ている部分をカメラ映像で描き直す（コーン・バー・クッション）
    if (real && lvl > 0 && lvl < S.eyeH) {
      const under = S.level === 5 ? 0 : lvl;
      const sil = [];
      COR.cones.forEach(cn => { if (under < COR.coneH) sil.push(coneSil(cn.x, cn.z, under)); });
      if (under < COR.barH + 0.03) COR.bars.forEach(([a, b]) => sil.push(barSil(COR.cones[a], COR.cones[b])));
      COR.cushions.forEach(cu => { if (cu.on && under < cu.h) sil.push(obsSil(cu, under)); });
      ctx.save();
      ctx.beginPath();
      sil.forEach(poly => polyPath(c, poly));
      ctx.clip();
      drawCam(c);
      ctx.restore();
    } else if (!real && lvl > 0 && lvl < S.eyeH) {
      const under = S.level === 5 ? 0 : lvl;
      COR.cushions.forEach(cu => { if (cu.on && under < cu.h) obsDraw(c, cu, under); });
      COR.cones.forEach(cn => { if (under < COR.coneH) coneAbove(c, cn.x, cn.z, under, '#1f8a4c', '#146436'); });
      if (under < COR.barH + 0.03) COR.bars.forEach(([a, b]) => bar(c, COR.cones[a], COR.cones[b]));

      COR.cushions.forEach(cu => { if (cu.on && lvl < cu.h) { const blk = cu.kind === 'block'; const r = blk ? (cu.w || cu.r * 2) / 2 + 0.01 : cu.r * (1 - lvl / cu.h) + 0.03; const dz = blk ? (cu.d || cu.r * 2) / 2 : 0; line3(c, [cu.x - r, lvl, cu.z - dz], [cu.x + r, lvl, cu.z - dz]); } });

      COR.bars.forEach(([a, b]) => poly3(c, barSil(COR.cones[a], COR.cones[b]), null, '#39ff8c', 2));
      COR.cushions.forEach(cu => { if (cu.on) poly3(c, obsSil(cu, 0), null, '#ffd23f', 2); });
      poly3(c, [[-COR.w / 2, 0, 0], [COR.w / 2, 0, 0], [COR.w / 2, 0, COR.len], [-COR.w / 2, 0, COR.len]], null, 'rgba(57,255,140,.6)', 1.5);
    }

    // かくれた危険の見える化
    if (S.reveal) {
      COR.cushions.forEach(cu => { if (cu.on) { poly3(c, obsSil(cu, 0), null, '#ff5a3c', 3); label3(c, cu.x, cu.h + 0.15, cu.z, '障害物（しょうがいぶつ）', 0.07, '#fff', '#c8352e'); } });
      if (!SIMPLE) { const mh = COR.manhole; poly3(c, circlePts(mh.x, mh.z, mh.r * 1.2), null, '#ff5a3c', 3); label3(c, mh.x, 0.3, mh.z, 'ふたの ないマンホール', 0.08, '#fff', '#c8352e'); }
    }
  }

  function boxSilWD(x, z, w, d, h, under) { const hw = w / 2, hd = d / 2; return [[x - hw, under, z - hd], [x + hw, under, z - hd], [x + hw, h, z - hd], [x + hw, h, z + hd], [x - hw, h, z + hd], [x - hw, h, z - hd]]; }
  function boxAboveWD(c, x, z, w, d, h, under, col, dark) { const hw = w / 2, hd = d / 2; poly3(c, [[x - hw, h, z - hd], [x + hw, h, z - hd], [x + hw, h, z + hd], [x - hw, h, z + hd]], col); poly3(c, [[x - hw, under, z - hd], [x + hw, under, z - hd], [x + hw, h, z - hd], [x - hw, h, z - hd]], dark); }
  function obsSil(cu, under) { return cu.kind === 'block' ? boxSilWD(cu.x, cu.z, cu.w || cu.r * 2, cu.d || cu.r * 2, cu.h, under) : coneSil(cu.x, cu.z, under, cu.h, cu.r); }
  function obsDraw(c, cu, under) { if (cu.kind === 'block') boxAboveWD(c, cu.x, cu.z, cu.w || cu.r * 2, cu.d || cu.r * 2, cu.h, under, '#d9d9d6', '#b5b5b0'); else coneAbove(c, cu.x, cu.z, under, '#d8402f', '#9c2a1f', cu.h, cu.r); }
  function circlePts(x, z, r, y) { const o = []; for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; o.push([x + r * Math.cos(a), y || 0.003, z + r * Math.sin(a)]); } return o; }
  function coneSil(x, z, under, h, r) {
    h = h || COR.coneH; r = r || COR.coneR;

    return [[x - r0, under, z], [x + r0, under, z], [x + rt, h, z], [x - rt, h, z]];
  }
  function barSil(a, b) {
    const h0 = COR.barH - 0.03, h1 = COR.barH + 0.03;
    const dx = b.z === a.z ? 0 : 0, dz = b.x === a.x ? 0 : 0; // まっすぐな棒

  }
  function polyPath(c, pts) {
    const NEAR = 0.06; const cs = pts.map(p => c.C(p[0], p[1], p[2])); const out = [];
    for (let i = 0; i < cs.length; i++) {
      const a = cs[i], b = cs[(i + 1) % cs.length]; const ain = a[2] >= NEAR, bin = b[2] >= NEAR;

    out.forEach((v, i) => { const p = c.S(v); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }); ctx.closePath();
  }
  function cone(c, x, z, col, dark) { coneAbove(c, x, z, 0, col, dark); }
  function coneAbove(c, x, z, under, col, dark, h, r) {
    const H = h || COR.coneH, R = r || COR.coneR, b = R + 0.02;
    if (under === 0) poly3(c, [[x - b, 0, z - b], [x + b, 0, z - b], [x + b, 0, z + b], [x - b, 0, z + b]], dark);
    poly3(c, coneSil(x, z, under, H, R), col);

      // 白帯（テープ）
      ctx.strokeStyle = '#f4f4f0'; ctx.lineWidth = 2;
      [0.1, 0.2, 0.3, 0.5].forEach(hh => { if (hh > under) { const rr = COR.coneR * (1 - hh / COR.coneH) + 0.02; line3(c, [x - rr, hh, z], [x + rr, hh, z]); } });
    }
  }
  function bar(c, a, b) {
    poly3(c, barSil(a, b), '#f4f4f0');
    // 緑の帯
    const n = 5; for (let i = 0; i < n; i += 2) {
      const t0 = i / n, t1 = (i + 1) / n;
      poly3(c, [[a.x + (b.x - a.x) * t0, COR.barH - 0.03, a.z + (b.z - a.z) * t0], [a.x + (b.x - a.x) * t1, COR.barH - 0.03, a.z + (b.z - a.z) * t1], [a.x + (b.x - a.x) * t1, COR.barH + 0.03, a.z + (b.z - a.z) * t1], [a.x + (b.x - a.x) * t0, COR.barH + 0.03, a.z + (b.z - a.z) * t0]], '#1f8a4c');
    }
  }
  function box(c, x, z, s, h, col, dark) { boxAbove(c, x, z, s, h, 0, col, dark); }
  function boxAbove(c, x, z, s, h, under, col, dark) {
    const hs = s / 2;
    poly3(c, [[x - hs, h, z - hs], [x + hs, h, z - hs], [x + hs, h, z + hs], [x - hs, h, z + hs]], col);

  }

  // 側溝からあふれて床に広がる水
  function drawPuddle(c, lvl) {
    const spread = Math.min(3.2, 0.1 + S.overflowT * 0.28);
    const pts = [];
    const gt = COR.gutter;
    pts.push([gt.x1, 0.006, -0.6]); pts.push([gt.x1, 0.006, 3.6]);
    for (let i = 0; i <= 16; i++) {
      const z = 3.6 - 4.2 * i / 16;
      const wob = 0.12 * Math.sin(z * 5 + S.t * 1.2) + 0.08 * Math.sin(z * 11 - S.t * 0.7);
      pts.push([gt.x0 - spread - wob, 0.006, z]);
    }
    poly3(c, pts, 'rgba(105,115,80,0.62)');
    // 湧き出しの泡
    ctx.fillStyle = 'rgba(240,245,235,0.8)';
    for (let i = 0; i < 18; i++) {
      const z = -0.3 + ((i * 0.53 + S.t * 0.4) % 3.6), r = 0.015 + (i % 3) * 0.01;
      const yy = 0.01 + ((S.t * 0.25 + i * 0.13) % 0.06);
      const p = c.P(gt.x0 + 0.06 - (i % 4) * 0.04, yy, z); if (p.z > 0.1) { ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, c.f * r / p.z), 0, Math.PI * 2); ctx.fill(); }
    }
  }

  // カメラ映像を水面の位置で上下に折り返して映り込みにする（縞ごとに少しゆらす）
  function drawCamReflection(c, horizon) {
    if (!S.cam || !cam.videoWidth || !S.reflect) return false;
    const { vw, vh, ox } = c;
    const sc = Math.max(vw / cam.videoWidth, vh / cam.videoHeight);
    const dw = cam.videoWidth * sc, dh = cam.videoHeight * sc, dx = ox + (vw - dw) / 2, dy = (vh - dh) / 2;
    const h0 = Math.max(0, Math.min(vh, horizon));
    ctx.save();
    ctx.beginPath(); ctx.rect(ox, h0, vw, vh - h0); ctx.clip();
    const strip = 10;
    for (let y = h0; y < vh; y += strip) {
      const dist = (y - h0) / Math.max(1, vh - h0);
      const wob = Math.sin(y * 0.09 + S.t * 2.2) * (2 + 6 * dist) + Math.sin(y * 0.031 - S.t * 1.3) * 3 * dist;
      // 水面の点 y に映るのは、水平線から同じ距離だけ上の景色
      const srcY = 2 * h0 - y;                        // 画面座標（反転後）
      const sy = (srcY - dy) / dh * cam.videoHeight;  // 動画のピクセル行
      if (sy < 0 || sy >= cam.videoHeight) continue;
      const sh = strip / dh * cam.videoHeight;
      ctx.drawImage(cam, 0, Math.max(0, sy - sh), cam.videoWidth, sh, dx + wob, y, dw, strip + 1);
    }
    ctx.restore();
    return true;
  }
  function drawWaterPlane(c, lvl, horizon, near) {
    const { vw, vh, ox } = c;
    const reflected = S.corridor && drawCamReflection(c, horizon);
    const wg = ctx.createLinearGradient(0, horizon, 0, vh);
    const murk = Math.min(1, S.murk);
    const a0 = S.opaque ? 0.97 : reflected ? 0.30 : S.corridor ? 0.42 : 0.35, a1 = S.opaque ? 1.0 : reflected ? 0.62 : S.corridor ? 0.72 : 0.6;
    const mixc = (i, k) => Math.round(WATER.clear[i] + (WATER.mud[i] - WATER.clear[i]) * murk + k);
    wg.addColorStop(0, `rgba(${mixc(0, 18)},${mixc(1, 18)},${mixc(2, 14)},${Math.min(0.97, a0 + 0.52 * murk)})`);
    wg.addColorStop(1, `rgba(${mixc(0, -14)},${mixc(1, -14)},${mixc(2, -12)},${Math.min(0.98, a1 + 0.26 * murk)})`);
    ctx.fillStyle = wg; ctx.fillRect(ox, Math.max(0, horizon), vw, vh);
    // 水面の照り返し（真水ほど明るく光る）
    const sk = WATER.sky;
    const sh = ctx.createLinearGradient(0, Math.max(0, horizon), 0, Math.max(1, horizon) + vh * 0.5);
    sh.addColorStop(0, `rgba(${sk[0]},${sk[1]},${sk[2]},${0.55 * (1 - 0.25 * murk)})`); sh.addColorStop(0.45, `rgba(${sk[0]},${sk[1]},${sk[2]},${0.18 * (1 - 0.25 * murk)})`); sh.addColorStop(1, `rgba(${sk[0]},${sk[1]},${sk[2]},0)`);
    ctx.fillStyle = sh; ctx.fillRect(ox, Math.max(0, horizon), vw, vh * 0.5);
    // 泥水：ゆっくり流れるにごりの帯
    if (murk > 0.05) {
      ctx.fillStyle = `rgba(${WATER.mud[0] + 26},${WATER.mud[1] + 24},${WATER.mud[2] + 18},${0.16 * murk})`;
      for (let i = 0; i < 7; i++) {
        const z = -0.3 + i * 0.55 + 0.08 * Math.sin(i * 2.3 + S.t * 0.4);
        const pts = []; for (let k = 0; k <= 12; k++) { const x = 2.8 - 5.6 * k / 12; pts.push([x, lvl + 0.001, z + 0.06 * Math.sin(x * 3 + S.t * 1.1 + i)]); }
        for (let k = 12; k >= 0; k--) { const x = 2.8 - 5.6 * k / 12; pts.push([x, lvl + 0.001, z + 0.16 + 0.05 * Math.sin(x * 2.5 - S.t * 0.9 + i)]); }
        poly3(c, pts, ctx.fillStyle);
      }
    }
    ctx.strokeStyle = `rgba(235,240,225,${0.26 - 0.12 * murk})`; ctx.lineWidth = 1.2;

      for (let i = 0; i < 12; i++) {
        const z = -0.4 + i * 0.36 + 0.1 * Math.sin(i * 3.1);

          const x = 2.6 - 5.4 * k / 40;

        }
        ctx.stroke();
      }
    }
  }

  // 雨粒が水面に当たる飛沫と輪（写真の白い点々）
  const hash2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
  function drawSplashes(c, lvl) {
    const N = 90;
    for (let i = 0; i < N; i++) {
      const cyc = Math.floor(S.t * 2.2 + i * 0.37), ph = (S.t * 2.2 + i * 0.37) - cyc;
      const x = hash2(i, cyc) * 7 - 3.5, z = hash2(i + 999, cyc) * 6.5 - 0.5;
      const p = c.P(x, lvl, z); if (p.z < 0.2 || p.z > 7) continue;
      const ppm = c.f / p.z; if (ppm < 20) continue;

      if (ph < 0.18) { ctx.fillStyle = `rgba(245,248,246,${0.85 - ph * 2})`; ctx.beginPath(); ctx.arc(p.x, p.y - ppm * 0.012 * (1 - ph / 0.18), Math.max(0.8, ppm * 0.006), 0, Math.PI * 2); ctx.fill(); }

  // 本物のコーン・バーの暗い鏡像（写真で自転車やポールが水に映る感じ）
  function drawReflections(c, lvl) {
    if (lvl <= 0 || lvl >= S.eyeH) return;
    if (S.cam && cam.videoWidth && S.reflect) return;   // カメラ映像の映り込みがあるときは不要
    const col = 'rgba(22,80,48,0.42)';
    COR.cones.forEach(cn => { if (lvl < COR.coneH) { const r0 = COR.coneR * (1 - lvl / COR.coneH) + 0.02, rt = 0.025, d = COR.coneH - lvl; poly3(c, [[cn.x - r0, lvl, cn.z], [cn.x + r0, lvl, cn.z], [cn.x + rt, lvl - d, cn.z], [cn.x - rt, lvl - d, cn.z]], col); } });
    if (lvl < COR.barH - 0.03) COR.bars.forEach(([a, b]) => { const A = COR.cones[a], B = COR.cones[b], d0 = COR.barH - 0.03 - lvl, d1 = COR.barH + 0.03 - lvl; poly3(c, [[A.x, lvl - d0, A.z], [B.x, lvl - d0, B.z], [B.x, lvl - d1, B.z], [A.x, lvl - d1, A.z]], col); });
    COR.cushions.forEach(cu => { if (cu.on && lvl < cu.h) { const w = cu.kind === 'block' ? (cu.w || cu.r * 2) : cu.r * 2 * (1 - lvl / cu.h) + 0.04, d = cu.h - lvl, dz = cu.kind === 'block' ? (cu.d || cu.r * 2) / 2 : 0; poly3(c, [[cu.x - w / 2, lvl, cu.z - dz], [cu.x + w / 2, lvl, cu.z - dz], [cu.x + w / 2 * (cu.kind === 'block' ? 1 : 0.3), lvl - d, cu.z - dz], [cu.x - w / 2 * (cu.kind === 'block' ? 1 : 0.3), lvl - d, cu.z - dz]], col); } });
  }

  function drawManhole(c, mh, lvl) {
    const pc = c.P(mh.x, 0.005, mh.z); if (pc.z < 0.1) return;
    const pr = c.P(mh.x + mh.r, 0.005, mh.z), pf = c.P(mh.x, 0.005, mh.z + mh.r);
    const rx = Math.abs(pr.x - pc.x), ry = Math.max(1, Math.abs(pf.y - pc.y));
    const popped = S.mhT > 0;
    ctx.beginPath(); ctx.ellipse(pc.x, pc.y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = popped ? '#0d0f11' : '#6e6a62'; ctx.fill();
    ctx.strokeStyle = '#b8b0a0'; ctx.lineWidth = Math.max(1, rx * 0.12); ctx.stroke();
    if (!popped) { ctx.strokeStyle = 'rgba(30,30,30,.5)'; ctx.lineWidth = 1; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(pc.x - rx * 0.7, pc.y + ry * i * 0.35); ctx.lineTo(pc.x + rx * 0.7, pc.y + ry * i * 0.35); ctx.stroke(); } }
    if (popped) {
      const age = S.t - S.mhT;
      // ずれたふた
      ctx.beginPath(); ctx.ellipse(pc.x + rx * 1.5, pc.y + ry * 0.3, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = '#7f7a70'; ctx.fill();
      if (age < 4) {
        // 噴き上がり
        ctx.strokeStyle = 'rgba(240,245,235,0.85)'; ctx.lineWidth = 2;
        for (let i = 0; i < 14; i++) {
          const a = (i / 14) * Math.PI * 2, hgt = (0.3 + 0.5 * Math.sin(age * 3 + i)) * (1 - age / 4);
          const top = c.P(mh.x + Math.cos(a) * mh.r * 0.8, hgt, mh.z + Math.sin(a) * mh.r * 0.8);
          ctx.beginPath(); ctx.moveTo(pc.x, pc.y); ctx.lineTo(top.x, top.y); ctx.stroke();
        }
      }
    }
  }

  // ===== まちの景色（VR） =====
  function drawStreet(c, lvl, horizon) {
    const { vw, vh, ox } = c;
    const sky = ctx.createLinearGradient(0, 0, 0, Math.max(1, horizon));
    sky.addColorStop(0, '#6d7b88'); sky.addColorStop(1, '#c9d3dc');
    ctx.fillStyle = sky; ctx.fillRect(ox, 0, vw, vh);
    ctx.fillStyle = '#5a5e62'; ctx.fillRect(ox, horizon, vw, vh);
    quad(c, [[-4.5,0,0.3],[-3.2,0,0.3],[-3.2,0,80],[-4.5,0,80]], '#8d8a83');
    quad(c, [[3.2,0,0.3],[4.5,0,0.3],[4.5,0,80],[3.2,0,80]], '#8d8a83');
    quad(c, [[-3.35,0,0.3],[-3.05,0,0.3],[-3.05,0,80],[-3.35,0,80]], '#2e3236');
    quad(c, [[3.05,0,0.3],[3.35,0,0.3],[3.35,0,80],[3.05,0,80]], '#2e3236');
    quad(c, [[-3.0,0,24],[3.0,0,24],[3.0,-1.3,27],[-3.0,-1.3,27]], '#45484c');
    quad(c, [[-3.0,-1.3,27],[3.0,-1.3,27],[3.0,-1.3,34],[-3.0,-1.3,34]], '#3a3d41');
    quad(c, [[-3.0,-1.3,34],[3.0,-1.3,34],[3.0,0,37],[-3.0,0,37]], '#45484c');
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    for (let z = 1; z < 24; z += 2.2) line3(c, [0, 0.005, z], [0, 0.005, z + 1.1]);

    drawManhole(c, manhole, lvl);

    if (S.level === 5) {
      // 側溝からあふれる（両側）
      const spread = Math.min(3.2, 0.1 + S.overflowT * 0.3);
      const L = [[-3.35, 0.006, 0.3], [-3.35, 0.006, 40]]; for (let i = 0; i <= 12; i++) { const z = 40 - 39.7 * i / 12; L.push([-3.05 + spread + 0.1 * Math.sin(z * 3 + S.t), 0.006, z]); }
      poly3(c, L, 'rgba(105,115,80,0.62)');
      const R = [[3.35, 0.006, 0.3], [3.35, 0.006, 40]]; for (let i = 0; i <= 12; i++) { const z = 40 - 39.7 * i / 12; R.push([3.05 - spread - 0.1 * Math.sin(z * 3 + S.t), 0.006, z]); }
      poly3(c, R, 'rgba(105,115,80,0.62)');
    } else if (lvl > 0 && lvl < S.eyeH) drawWaterPlane(c, lvl, horizon, 3.5);

    buildings.slice().sort((a, b) => b.z0 - a.z0).forEach(b => {
      const inner = b.x0 < 0 ? b.x1 : b.x0;
      quad(c, [[inner,0,b.z0],[inner,0,b.z1],[inner,b.h,b.z1],[inner,b.h,b.z0]], shade(b.c, -18));
      quad(c, [[b.x0,0,b.z0],[b.x1,0,b.z0],[b.x1,b.h,b.z0],[b.x0,b.h,b.z0]], b.c);
      for (let wy = 1.2; wy < b.h - 1; wy += 1.6) for (let wx = b.x0 + 0.8; wx < b.x1 - 0.8; wx += 1.6) {
        quad(c, [[wx,wy,b.z0-0.01],[wx+0.9,wy,b.z0-0.01],[wx+0.9,wy+0.9,b.z0-0.01],[wx,wy+0.9,b.z0-0.01]], 'rgba(220,230,240,.55)');
      }
      if (lvl > 0.05) {
        quad(c, [[inner,0,b.z0],[inner,0,b.z1],[inner,lvl,b.z1],[inner,lvl,b.z0]], WC);
        quad(c, [[b.x0,0,b.z0-0.02],[b.x1,0,b.z0-0.02],[b.x1,lvl,b.z0-0.02],[b.x0,lvl,b.z0-0.02]], WC);
      }
    });
    quad(c, [[subway.x-1.2,0,subway.z],[subway.x+1.2,0,subway.z],[subway.x+1.2,2.4,subway.z],[subway.x-1.2,2.4,subway.z]], '#c9c1b2');
    quad(c, [[subway.x-0.8,0,subway.z-0.01],[subway.x+0.8,0,subway.z-0.01],[subway.x+0.8,1.9,subway.z-0.01],[subway.x-0.8,1.9,subway.z-0.01]], '#1c1f22');
    if (lvl > 0.05) quad(c, [[subway.x-1.2,0,subway.z-0.02],[subway.x+1.2,0,subway.z-0.02],[subway.x+1.2,lvl,subway.z-0.02],[subway.x-1.2,lvl,subway.z-0.02]], WC);
    label3(c, subway.x, 2.7, subway.z, '地下 ↓', 0.32, '#1c2733', '#fff3c4');
    label3(c, 0, 4.2, 24.5, 'アンダーパス ↓', 0.7, '#ffffff', '#1f6f8b');

    pole(c, -2.6, 2.4);

    figures.slice().sort((a, b) => b.z - a.z).forEach(fg => {
      drawFigure(c, fg);
      const bs = fg.base || 0;
      if (lvl > bs && lvl > 0.05) {
        const gb = c.P(fg.x, bs, fg.z), wl = c.P(fg.x, lvl, fg.z);
        if (gb.z > 0.1) { const ppm = c.f / gb.z; ctx.fillStyle = WC; ctx.fillRect(gb.x - 1.1 * ppm, wl.y, 2.2 * ppm, gb.y - wl.y + 1); }
      }
    });
    if (lvl > 0.05) {
      ctx.strokeStyle = 'rgba(240,245,235,.8)'; ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const x = subway.x - 0.6 + i * 0.3, zz = subway.z - 0.9 + ((S.t * 1.5 + i * 0.2) % 0.9);
        line3(c, [x, lvl, zz], [x, lvl * 0.4, zz + 0.25]);
      }
    }
    drawDebris(c, lvl);
    drawCar(c, lvl, -2.0, 5.0);

    if (S.reveal) {
      const mh = manhole; poly3(c, circlePts(mh.x, mh.z, mh.r * 1.3), null, '#ff5a3c', 3);
      label3(c, mh.x, 0.45, mh.z, 'ふたの ないマンホール', 0.13, '#fff', '#c8352e');
      ctx.setLineDash([8, 6]); ctx.strokeStyle = '#ff5a3c'; ctx.lineWidth = 3;
      line3(c, [-3.2, 0.02, 0.5], [-3.2, 0.02, 40]); line3(c, [3.2, 0.02, 0.5], [3.2, 0.02, 40]);
      ctx.setLineDash([]);
      label3(c, -3.2, 0.3, 2.0, 'みぞ（側溝）', 0.11, '#fff', '#c8352e');
    }
  }

  // ===== 浮遊物 =====
  const DEBRIS_KINDS = ['bottle', 'bag', 'can', 'branch', 'bucket', 'bottle', 'foam'];
  function spawnDebris() {
    const cor = S.corridor;
    const k = DEBRIS_KINDS[Math.floor(Math.random() * DEBRIS_KINDS.length)];
    S.debris.push({
      k, x: cor ? COR.gutter.x1 + 0.1 + Math.random() * 0.6 : (Math.random() * 5 - 2.5),
      z: cor ? 0.5 + Math.random() * 2.6 : 22 + Math.random() * 6,
      stop: cor ? -2.8 : 1.2 + Math.random() * 3,   // 通路は右→左に流れて、左へ抜けていく
      v: cor ? 0.25 + Math.random() * 0.15 : 1.2 + Math.random() * 0.6,
      rot: Math.random() * 6.28, ph: Math.random() * 6.28,
    });
  }
  function updateDebris(dt) {
    const lvl = S.lvl;
    if (lvl >= 0.1 && lvl < S.eyeH && S.debrisOn) {
      S.debrisT += dt;
      if (S.debrisT > (S.corridor ? 1.6 : 2.2) && S.debris.length < 10) { S.debrisT = 0; spawnDebris(); }
    } else if (lvl === 0 || !S.debrisOn) S.debris.length = 0;
    S.debris.forEach(d => { if (S.corridor) { d.x -= d.v * dt; } else if (d.z > d.stop) d.z = Math.max(d.stop, d.z - d.v * dt); d.rot += dt * 0.3; });
    if (S.corridor) S.debris = S.debris.filter(d => d.x > -2.8);
  }
  function drawDebris(c, lvl) {
    if (lvl < 0.1) return;
    const HGT = { bottle: 0.085, bag: 0.28, can: 0.065, branch: 0.18, bucket: 0.26, foam: 0.22 };
    S.debris.slice().sort((a, b) => b.z - a.z).forEach(d => {
      const h = HGT[d.k] || 0.2, sink = h * (d.k === 'bag' ? 0.3 : d.k === 'foam' ? 0.25 : 0.45);
      const y = lvl - sink + 0.012 * Math.sin(S.t * 2 + d.ph);   // 一部が水に沈んだ高さに置く
      const p = c.P(d.x, y, d.z); if (p.z < 0.1) return;
      const ppm = c.f / p.z, X = p.x, Y = p.y;
      const wl = c.P(d.x, lvl, d.z);
      const after = () => { ctx.fillStyle = WC; ctx.fillRect(X - 0.6 * ppm, wl.y, 1.2 * ppm, Math.max(0, Y - wl.y + 1)); };
      const R = (x0, y0, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(X + (x0 - w / 2) * ppm, Y - (y0 + h) * ppm, w * ppm, h * ppm); };
      if (drawImg(d.k, X, Y, ppm)) { after(); return; }
      if (d.k === 'bucket') { ctx.fillStyle = '#3c8fd6'; ctx.beginPath(); ctx.moveTo(X - 0.16 * ppm, Y - 0.26 * ppm); ctx.lineTo(X + 0.16 * ppm, Y - 0.26 * ppm); ctx.lineTo(X + 0.12 * ppm, Y); ctx.lineTo(X - 0.12 * ppm, Y); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#8fc4ee'; ctx.lineWidth = Math.max(1, 0.015 * ppm); ctx.beginPath(); ctx.arc(X, Y - 0.26 * ppm, 0.16 * ppm, Math.PI, 0); ctx.stroke(); }
      else if (d.k === 'can') { R(0, 0, 0.12, 0.065, '#d9d9d9'); R(-0.05, 0.0, 0.02, 0.065, '#9a9a9a'); R(0.05, 0.0, 0.02, 0.065, '#9a9a9a'); R(0, 0.02, 0.07, 0.025, '#c8352e'); }
      else if (d.k === 'bag') { ctx.fillStyle = '#2f3438'; ctx.beginPath(); ctx.ellipse(X, Y - 0.12 * ppm, 0.24 * ppm, 0.14 * ppm, 0, 0, Math.PI * 2); ctx.fill(); R(0.12, 0.2, 0.08, 0.08, '#4a5056'); }
      else if (d.k === 'branch') { ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = Math.max(2, 0.035 * ppm); ctx.beginPath(); ctx.moveTo(X - 0.35 * ppm, Y - 0.02 * ppm); ctx.lineTo(X + 0.3 * ppm, Y - 0.06 * ppm); ctx.moveTo(X, Y - 0.04 * ppm); ctx.lineTo(X + 0.12 * ppm, Y - 0.18 * ppm); ctx.stroke(); }
      else if (d.k === 'foam') { R(0, 0, 0.38, 0.22, '#f3f3ee'); ctx.strokeStyle = '#cfcfc6'; ctx.lineWidth = 1; ctx.strokeRect(X - 0.19 * ppm, Y - 0.22 * ppm, 0.38 * ppm, 0.22 * ppm); }
      else if (d.k === 'bottle') { R(0.02, 0, 0.24, 0.085, 'rgba(180,220,240,.85)'); R(-0.125, 0.02, 0.035, 0.045, '#2a6fb0'); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.strokeRect(X - 0.1 * ppm, Y - 0.085 * ppm, 0.24 * ppm, 0.085 * ppm); }
      else if (d.k === 'board') { R(0, 0, 0.9, 0.05, '#c9a56a'); R(0, 0.05, 0.9, 0.01, '#8f6d3d'); }
      after();
    });
  }

  // ===== 車 =====
  function startCar() { if (SIMPLE) return; S.car = { t0: S.t, stalled: false, stallT: 0, floatT: 0 }; if (S.sound) snd.engine(true); }
  function updateCar(dt) {
    if (!S.car) return;
    const lvl = S.lvl;
    const age = S.t - S.car.t0;
    const startZ = S.corridor ? 14 : 45, stopZ = S.corridor ? 3.2 : 5.0, endZ = S.corridor ? -6 : -3;
    // 30cm未満：水しぶきを上げて通り過ぎる。30cm以上：止まる位置で止まる
    if (!S.car.stalled) {
      const speed = S.corridor ? 3.0 : 8.0;
      S.car.z = (S.car.z === undefined ? startZ : S.car.z) - speed * dt;
      if (lvl >= 0.3 && S.car.z <= stopZ) { S.car.z = stopZ; S.car.stalled = true; S.car.stallT = S.t; if (S.sound) snd.engine(false); }
      if (S.car.z < endZ) { S.car = null; if (S.sound) snd.engine(false); return; }
    }
    if (S.car.stalled && lvl >= 0.5) S.car.floatT += dt;
    if (S.car.stalled && age > 60) { S.car = null; if (S.sound) snd.engine(false); }
  }
  function drawCar(c, lvl, laneX, stopZ) {
    if (!S.car) return;
    const ease = S.car.stalled ? 1 : 0.3;
    let z = S.car.z === undefined ? (S.corridor ? 14 : 45) : S.car.z;
    if (z < 0.3) return;
    let base = 0, x = laneX;
    if (S.car.floatT > 0) { base = Math.min(0.15, S.car.floatT * 0.05) + 0.03 * Math.sin(S.t * 1.5); x += Math.sin(S.car.floatT * 0.4) * 0.3; }
    const fg = { k: 'car', x, z, h: 1.5, base, name: '' };
    drawFigure(c, fg);
    const gb = c.P(x, base, z); if (gb.z < 0.1) return;
    const ppm = c.f / gb.z, X = gb.x, Y = gb.y;
    // ライト
    const moving = !S.car.stalled;
    if (!fg.img) {
    ctx.fillStyle = moving ? '#fff7b0' : '#8a8560';
    ctx.fillRect(X - 0.76 * ppm, Y - 0.69 * ppm, 0.28 * ppm, 0.14 * ppm); ctx.fillRect(X + 0.48 * ppm, Y - 0.69 * ppm, 0.28 * ppm, 0.14 * ppm);
    if (moving) { ctx.fillStyle = 'rgba(255,247,176,0.25)'; ctx.beginPath(); ctx.moveTo(X - 0.62 * ppm, Y - 0.62 * ppm); ctx.lineTo(X - 1.6 * ppm, Y + 0.3 * ppm); ctx.lineTo(X - 0.1 * ppm, Y + 0.3 * ppm); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(X + 0.62 * ppm, Y - 0.62 * ppm); ctx.lineTo(X + 1.6 * ppm, Y + 0.3 * ppm); ctx.lineTo(X + 0.1 * ppm, Y + 0.3 * ppm); ctx.closePath(); ctx.fill(); }
    // ハザード
    if (S.car.stalled && Math.floor((S.t - S.car.stallT) * 2) % 2 === 0) { ctx.fillStyle = '#ff9a1f'; ctx.fillRect(X - 0.9 * ppm, Y - 0.62 * ppm, 0.12 * ppm, 0.1 * ppm); ctx.fillRect(X + 0.78 * ppm, Y - 0.62 * ppm, 0.12 * ppm, 0.1 * ppm); }
    }
    // 水しぶき（走っている間、両側のタイヤから扇形に）
    if (moving && lvl > 0) {
      const sp = 1 - ease; // 速いほど大きい
      const hgt = (0.25 + 0.55 * sp) + lvl, wid = 0.5 + 0.6 * sp;
      [-1, 1].forEach(sg => {
        ctx.fillStyle = 'rgba(240,246,238,0.55)';
        ctx.beginPath(); ctx.moveTo(X + sg * 0.6 * ppm, Y - lvl * ppm);
        for (let k = 0; k <= 8; k++) { const t = k / 8, px = X + sg * (0.6 + wid * t) * ppm, py = Y - (lvl + hgt * Math.sin(t * Math.PI) * (0.8 + 0.2 * Math.sin(S.t * 20 + k))) * ppm; ctx.lineTo(px, py); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 10; i++) { const t = ((S.t * 3 + i * 0.37) % 1), px = X + sg * (0.6 + wid * t) * ppm, py = Y - (lvl + hgt * Math.sin(t * Math.PI) * (0.6 + 0.5 * ((i * 7) % 5) / 5)) * ppm; ctx.beginPath(); ctx.arc(px, py, Math.max(1, 0.025 * ppm), 0, Math.PI * 2); ctx.fill(); }
      });
    }
    // 水没部分
    if (lvl > base) { const wl = c.P(x, lvl, z); ctx.fillStyle = WC; ctx.fillRect(X - 1.0 * ppm, wl.y, 2.0 * ppm, Y - wl.y + 1); }
    if (S.car.stalled) label3(c, x, 1.9, z, 'エンジンが とまった！', S.corridor ? 0.12 : 0.3, '#fff', '#c8352e');
  }

  // ===== 音（端末のスピーカー） =====
  const snd = (() => {
    let ac = null, rain = null, eng = null, engGain = null, bub = null, bubGain = null, tick = 0;
    function ctxInit() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
    function noise(a) { const b = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = a.createBufferSource(); s.buffer = b; s.loop = true; return s; }
    return {
      start() {
        const a = ctxInit();
        if (!rain) { rain = noise(a); const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 0.6; const g = a.createGain(); g.gain.value = 0.035; rain.connect(f).connect(g).connect(a.destination); rain.start(); }
        if (!bub) { bub = noise(a); const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; bubGain = a.createGain(); bubGain.gain.value = 0; bub.connect(f).connect(bubGain).connect(a.destination); bub.start(); }
      },
      stop() { if (ac) { ac.suspend(); } },
      update(dt) {
        if (!ac || ac.state !== 'running') return;
        if (bubGain) bubGain.gain.value = S.level === 5 ? 0.25 + 0.15 * Math.sin(S.t * 7) : (S.level >= 10 && S.level < 100 ? 0.035 : 0);
        if (eng) { const lvl = S.level / 100; eng.frequency.value = S.car && !S.car.stalled ? 70 + 40 * Math.sin(S.t * 1.3) : 0; }
        if (S.car && S.car.stalled) { tick += dt; if (tick > 0.5) { tick = 0; this.click(); } }
      },
      engine(on) {
        const a = ctxInit();
        if (on && !eng) { eng = a.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 90; const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; engGain = a.createGain(); engGain.gain.value = 0.12; eng.connect(f).connect(engGain).connect(a.destination); eng.start(); }
        if (!on && eng) { const e = eng, g = engGain; eng = null; e.frequency.linearRampToValueAtTime(30, a.currentTime + 0.8); g.gain.linearRampToValueAtTime(0, a.currentTime + 0.9); setTimeout(() => { try { e.stop(); } catch (x) {} }, 1000); }
      },
      click() { const a = ctxInit(); const o = a.createOscillator(); o.type = 'square'; o.frequency.value = 1800; const g = a.createGain(); g.gain.value = 0.05; o.connect(g).connect(a.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.05); o.stop(a.currentTime + 0.06); },
      alarm() { const a = ctxInit(); [0, 0.35, 0.7].forEach(t => { const o = a.createOscillator(); o.type = 'square'; o.frequency.value = 1100; const g = a.createGain(); g.gain.value = 0.12; o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.25); }); },
    };
  })();

  function shade(hex, d) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + d)), g = Math.max(0, Math.min(255, ((n >> 8) & 255) + d)), b = Math.max(0, Math.min(255, (n & 255) + d));
    return `rgb(${r},${g},${b})`;
  }
  function line3(c, a, b) {
    const pa = c.P(a[0], a[1], a[2]), pb = c.P(b[0], b[1], b[2]);
    if (pa.z < 0.05 || pb.z < 0.05) return;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  function label3(c, x, y, z, text, hm, fg, bg) {
    const p = c.P(x, y, z); if (p.z < 0.1) return;
    const px = Math.max(9, c.f * hm / p.z);
    ctx.font = `900 ${px}px "Zen Maru Gothic", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + px;
    ctx.fillStyle = bg; rr(p.x - w / 2, p.y - px * 0.75, w, px * 1.5, px * 0.4); ctx.fill();
    ctx.fillStyle = fg; ctx.fillText(text, p.x, p.y);
  }
  function pill(x, y, text, px, fg, bg) {
    const w = ctx.measureText(text).width + px * 1.2;
    ctx.fillStyle = bg; rr(x - w / 2, y - px * 0.25, w, px * 1.5, px * 0.5); ctx.fill();
    ctx.fillStyle = fg; ctx.textBaseline = 'top'; ctx.textAlign = 'center'; ctx.fillText(text, x, y);
  }
  function wrapPill(c, x, y, text, px, maxW) {
    const words = text.split(' '); const lines = []; let cur = '';
    words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW - px && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur);
    lines.forEach((l, i) => pill(x, y + i * px * 1.7, l, px, '#1c2733', 'rgba(255,255,255,.85)'));
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // 量水標（水位ポール）
  function pole(c, x, z) {
    const base = c.P(x, 0, z); if (base.z < 0.1) return;
    const ppm = c.f / base.z;
    const w = 0.12 * ppm;
    ctx.fillStyle = '#f6f2e6'; ctx.fillRect(base.x - w / 2, base.y - 1.0 * ppm, w, 1.0 * ppm);
    ctx.strokeStyle = '#1c2733'; ctx.lineWidth = Math.max(1, ppm * 0.012);
    ctx.strokeRect(base.x - w / 2, base.y - 1.0 * ppm, w, 1.0 * ppm);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (let h = 10; h <= 100; h += 10) {
      const y = base.y - h / 100 * ppm; const big = h % 50 === 0 || h === 10 || h === 20 || h === 30 || h === 70;
      ctx.beginPath(); ctx.moveTo(base.x - w / 2, y); ctx.lineTo(base.x - w / 2 + (big ? w : w * 0.5), y); ctx.stroke();
      if (big) { ctx.font = `900 ${Math.max(8, ppm * 0.075)}px "Zen Maru Gothic", sans-serif`; ctx.fillStyle = '#1c2733'; ctx.fillText(h + '', base.x + w * 0.7, y); }
    }
    // 現在の水位マーク
    if (S.level > 0) {
      const y = base.y - S.level / 100 * ppm;
      ctx.fillStyle = WC; ctx.fillRect(base.x - w, y, w * 2.6, base.y - y + 1);
      ctx.fillStyle = '#e8912d'; ctx.beginPath(); ctx.moveTo(base.x - w / 2 - w * 0.9, y - w * 0.4); ctx.lineTo(base.x - w / 2, y); ctx.lineTo(base.x - w / 2 - w * 0.9, y + w * 0.4); ctx.closePath(); ctx.fill();
    }
  }

  // 人・車（正面向きの板絵）
  function drawFigure(c, fg) {
    const base = c.P(fg.x, fg.base || 0, fg.z); if (base.z < 0.1) return;
    const ppm = c.f / base.z, X = base.x, Y = base.y;
    const R = (x0, y0, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(X + (x0 - w / 2) * ppm, Y - (y0 + h) * ppm, w * ppm, h * ppm); };
    const C = (x0, y0, r, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X + x0 * ppm, Y - y0 * ppm, r * ppm, 0, Math.PI * 2); ctx.fill(); };
    if (fg.k === 'car') {
      if (drawImg(S.car && S.car.stalled && IMG.carStalled ? 'carStalled' : 'car', X, Y, ppm)) { fg.img = true; }
      else {
      R(0, 0.3, 1.75, 0.55, '#d84a3a'); R(0, 0.85, 1.35, 0.55, '#d84a3a');
      R(0, 0.9, 1.1, 0.42, '#b9d6e8');
      C(-0.62, 0.3, 0.3, '#1c1f22'); C(0.62, 0.3, 0.3, '#1c1f22'); C(-0.62, 0.3, 0.13, '#8a8f95'); C(0.62, 0.3, 0.13, '#8a8f95');
      R(-0.62, 0.55, 0.28, 0.14, '#fff2b0'); R(0.62, 0.55, 0.28, 0.14, '#fff2b0');
      }
    } else {
      const skin = '#f0c9a6', h = fg.h;
      const head = h * 0.085, torsoTop = h * 0.83, hip = h * 0.48;
      const col = fg.k === 'child' ? '#f2b53c' : fg.k === 'woman' ? '#7a5aa8' : '#2f6f9f';
      R(-0.06 * h / 1.7, 0, 0.09 * h / 1.7 + 0.02, hip, '#3b3f45'); R(0.06 * h / 1.7, 0, 0.09 * h / 1.7 + 0.02, hip, '#3b3f45');
      if (fg.k === 'woman') { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(X - 0.14 * ppm, Y - hip * ppm); ctx.lineTo(X + 0.14 * ppm, Y - hip * ppm); ctx.lineTo(X + 0.26 * ppm, Y - hip * 0.55 * ppm); ctx.lineTo(X - 0.26 * ppm, Y - hip * 0.55 * ppm); ctx.closePath(); ctx.fill(); }
      R(0, hip, h * 0.24, torsoTop - hip, col);
      R(-h * 0.16, hip + 0.02, h * 0.07, torsoTop - hip - 0.05, col); R(h * 0.16, hip + 0.02, h * 0.07, torsoTop - hip - 0.05, col);
      C(0, h - head, head, skin);
      // ひざ線
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(X - 0.3 * ppm, Y - hip * 0.55 * ppm); ctx.lineTo(X + 0.3 * ppm, Y - hip * 0.55 * ppm); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `900 ${Math.max(8, ppm * 0.09)}px "Zen Maru Gothic", sans-serif`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('ひざ', X + 0.32 * ppm, Y - hip * 0.55 * ppm);
    }
    // 名前と身長
    if (!fg.name) return;
    ctx.font = `900 ${Math.max(9, ppm * 0.11)}px "Zen Maru Gothic", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const ty = Y - (fg.h + 0.25) * ppm, tw = ctx.measureText(fg.name).width + ppm * 0.12;
    ctx.fillStyle = 'rgba(255,255,255,.85)'; rr(X - tw / 2, ty - ppm * 0.15, tw, ppm * 0.17, ppm * 0.05); ctx.fill();
    ctx.fillStyle = '#1c2733'; ctx.fillText(fg.name, X, ty);
  }

  // ---------- 係員用：通路と障害物の位置合わせ（リモコンの K で開閉） ----------
  function setCalib(on) { S.calib = on; $('calPanel').hidden = !on; if (on) calSync(); }
  function calSync() {
    $('calYaw').value = S.cal.yaw * 180 / Math.PI; $('calYawV').textContent = (S.cal.yaw * 180 / Math.PI).toFixed(1) + '°';
    $('calEye').value = S.eyeH; $('calEyeV').textContent = S.eyeH.toFixed(2) + 'm';
    $('calFov').value = S.cal.fov; $('calFovV').textContent = S.cal.fov + '°';
    $('calZ').value = S.cal.z; $('calZV').textContent = S.cal.z.toFixed(2) + 'm';
    $('calW').value = String(S.cal.w);
  }
  function calSave() { try { localStorage.setItem('cal', JSON.stringify(S.cal)); localStorage.setItem('eyeH', String(S.eyeH)); } catch (e) {} }
  $('calYaw').addEventListener('input', e => { S.cal.yaw = +e.target.value * Math.PI / 180; calSave(); calSync(); });
  $('calEye').addEventListener('input', e => { S.eyeH = +e.target.value; calSave(); calSync(); });
  $('calFov').addEventListener('input', e => { S.cal.fov = +e.target.value; calSave(); calSync(); });
  $('calZ').addEventListener('input', e => { S.cal.z = +e.target.value; calSave(); calSync(); });
  function setObs(i, v) {
    const [k, h] = v.split(':'); const cu = COR.cushions[i];
    cu.on = v !== 'off'; if (!cu.on) return;
    if (k === 'brick') { // スチロールブロック 100×190×390mm（コンクリートブロック型）
      cu.kind = 'block';
      if (h === 'flat') { cu.w = 0.39; cu.d = 0.19; cu.h = 0.10; }
      else if (h === 'side') { cu.w = 0.39; cu.d = 0.10; cu.h = 0.19; }
      else { cu.w = 0.19; cu.d = 0.10; cu.h = 0.39; }
      cu.r = cu.w / 2; return;
    }
    cu.kind = k; cu.h = +h; cu.w = cu.d = undefined; cu.r = k === 'block' ? +h / 2 : (+h > 0.4 ? 0.12 : 0.10);
  }
  $('calH1').addEventListener('change', e => setObs(0, e.target.value));
  $('calH2').addEventListener('change', e => setObs(1, e.target.value));
  $('calH3').addEventListener('change', e => setObs(2, e.target.value));
  $('calW').addEventListener('change', e => { S.cal.w = +e.target.value; setCorridorWidth(S.cal.w); calSave(); });
  $('calClose').addEventListener('click', () => setCalib(false));
  $('calStraight').addEventListener('click', () => { S.cal.yaw = -(rawYaw() - (S.station ? Math.PI : 0)) - S.dragYaw; calSave(); calSync(); });

  // ---------- 床の設定（FloorPlacer）：タップした向きを通路の「まっすぐ」にして、そこを水位0の基準にする ----------
  cv.addEventListener('pointerdown', e => dragStart(e));
  cv.addEventListener('pointerup', e => {
    dragEnd(e);
    if (!FloodUI.placed && !dragged && tiltOK()) { S.cal.yaw = -rawYaw() - S.dragYaw; calSave(); if (S.calib) calSync(); FloodUI.setPlaced(true); }
  });

  // ---------- 体験の開始・終了 ----------
  async function enter() {
    await enableSensor(true);          // 1. 傾きセンサー（iPhone は許可のダイアログ）
    await startCam();                  // 2. カメラ（許可のダイアログ）。どちらも取れなければ理由を投げる
    exp.classList.add('on');
    S.dragYaw = 0; S.dragPitch = 0;
    resize();
    if (!raf) { last = performance.now(); loop(); }
  }
  function leave() {
    exp.classList.remove('on');
    setCalib(false); S.station = 0;
    FloodUI.setWait(null);
    stopCam();
    cancelAnimationFrame(raf); raf = 0;
  }

  // ---------- ループ ----------
  let last = performance.now();
  function loop(now) {
    raf = requestAnimationFrame(loop);
    now = now || performance.now();
    const dt = Math.min(0.1, (now - last) / 1000); last = now; S.t += dt;
    FloodUI.tick(dt);
    // 水の状態は ui.js の Water から受け取る（表示上の水位はなめらかに動く）
    const Wt = FloodUI.Water;
    S.level = Wt.levelCm; S.opaque = Wt.opaque;
    // にごり：元の版と同じ（水位に連動して murkFromCm〜murkToCm で直線的に濁る。M キーで真水／泥水に固定）
    if (Wt.murkMode === 'auto') { const k = Math.max(0, Math.min(1, (Wt.shownLevel - WS.murkFromCm) / (WS.murkToCm - WS.murkFromCm))); S.murk += (k - S.murk) * Math.min(1, dt * 1.5); }
    else if (Wt.murkMode === 'clear') S.murk = Math.max(0, S.murk - dt); else S.murk = Math.min(1, S.murk + dt);
    const tilt = tiltOK();
    FloodUI.setWait(tilt ? null : T.tiltWait);
    sensorBtn.hidden = FloodUI.goggle;
    if (tilt && sensorBtn.textContent !== T.sensorActive) sensorBtn.textContent = T.sensorActive;
    S.lvl = tilt && FloodUI.placed && Wt.shownLevel > 0.2 ? Math.max(0, (Wt.shownLevel + Wt.floorOffsetCm) / 100) : 0;
    FloodUI.setUnderwater(S.lvl > 0 && S.lvl >= S.eyeH);             // 目の高さより水が高い＝水中
    updateDebris(dt); updateCar(dt);
    if (!W || !H) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const { yaw, pitch } = viewAngles();
    drawScene(makeCamera(yaw, pitch, 0, W, H, 0, S.cal.fov * Math.PI / 180), 0);
  }

  FloodUI.start({
    fullscreen: true,
    onEnter: enter,
    onFinish: leave,
    onReplace: () => { S.station = 0; },
    // 設定パネルに「位置合わせ（係員用）」を足す（共通版だけ。Android版は床を検出するので要らない）
    extraButtons: [{ label: T.calibButton, onClick: () => setCalib(true) }],
    // 係員用のキー：K = 位置合わせパネル、T = ゴールで止まる（ゴールから入口の方を見た向きに通路を切り替える）
    onKey: k => {
      if (k === 'k' || k === 'K') { setCalib(!S.calib); return true; }
      if (k === 't' || k === 'T') { S.station = S.station ? 0 : 1; return true; }
      return false;
    },
  });

  // Android の Chrome などで WebXR の AR が使えるなら、説明画面で Android版をすすめる
  if (/Android/i.test(navigator.userAgent) && navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-ar').then(ok => {
      if (ok) FloodUI.showNotice(FloodUI.esc(T.androidNote) + '<br><a href="android.html">' + FloodUI.esc(T.androidLink) + '</a>');
    }).catch(() => {});
  }
})();
</script>
